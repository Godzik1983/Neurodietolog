
services:
  max_reviews_bot:
    build:
      context: ./max_reviews_bot
      dockerfile: Dockerfile
    container_name: max_reviews_bot
    env_file:
      - ./max_reviews_bot/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/data/max_dialogs.db
      - DOWNLOAD_DIR=/data/downloads
      - FAISS_INDEX_PATH=/app/faiss_index
    volumes:
      - ./max_reviews_bot/data:/data
    restart: unless-stopped
